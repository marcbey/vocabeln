services:
  - type: web
    name: vokabeln-app
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm run start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_STT_MODEL
        value: gpt-4o-mini-transcribe
